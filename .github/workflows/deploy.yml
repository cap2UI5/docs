name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci

      # The docs make concrete claims about two repositories — paths, app ids,
      # the plugin's exports and options against cap2UI5, and the framework's
      # class names against the abap2UI5 source its runtime is transpiled
      # from. Nothing else checks them: `vitepress build` validates internal
      # links and stops there, so every rename silently rots the prose.
      - name: Check out cap2UI5 (reference target)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cap2UI5/cap2UI5
          path: .cap2ui5-ref

      - name: Check out abap2UI5 (the framework the runtime is built from)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/abap2UI5
          path: .abap2ui5-ref

      # check:CI, not check: this job HAS both checkouts, so a missing one is
      # a broken workflow rather than a laptop without a clone, and
      # verify-refs' leniency would let the deploy publish while silently
      # checking less than it says. The lenient `npm run check` is for a
      # contributor's machine; both CI jobs refuse to skip.
      - name: Check (verify-refs + build)
        run: npm run check:ci
        env:
          CAP2UI5_DIR: .cap2ui5-ref
          ABAP2UI5_DIR: .abap2ui5-ref

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
